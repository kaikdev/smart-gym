services:

  mysql:
    image: mysql:8.4
    container_name: smartgym-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: smart_gym
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM eclipse-temurin:17-jdk AS build
        WORKDIR /app
        COPY . .
        RUN sed -i 's/\r//' gradlew && chmod +x gradlew && ./gradlew bootJar --no-daemon -q
        RUN cp build/libs/*-SNAPSHOT.jar app.jar

        FROM eclipse-temurin:17-jre
        WORKDIR /app
        COPY --from=build /app/app.jar app.jar
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar"]
    container_name: smartgym-backend
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_gym
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM azul/zulu-openjdk:21 AS build
        RUN apt-get update \
            && apt-get install -y --no-install-recommends curl unzip libatomic1 \
            && rm -rf /var/lib/apt/lists/*
        ENV ANDROID_HOME=/opt/android-sdk
        RUN mkdir -p /opt/android-sdk/cmdline-tools \
            && curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            && unzip -q /tmp/tools.zip -d /opt/android-sdk/cmdline-tools \
            && mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest \
            && rm /tmp/tools.zip \
            && yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
        WORKDIR /app
        COPY . .
        RUN sed -i 's/\r//' gradlew && chmod +x gradlew \
            && ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --no-configuration-cache

        FROM nginx:1.27-alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        COPY --from=build /app/webApp/build/dist/wasmJs/productionExecutable /usr/share/nginx/html
        EXPOSE 80
    container_name: smartgym-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    profiles:
      - web

volumes:
  mysql-dados:
